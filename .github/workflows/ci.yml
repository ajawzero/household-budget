# Runs scripts/check.sh (the same checks as before every commit) on the fake samples.
# No secrets. Actions are pinned by commit SHA, each release at least two weeks old.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same uv as the Dockerfile.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/tools/apigen/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          uv python install
          uv sync --frozen

      # check.sh skips the frontend steps without node_modules, so install it here.
      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Check
        run: scripts/check.sh
